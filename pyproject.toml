[project]
name = "ama2"
version = "0.1.0"
description = "Adaptive ML Analyst Agent (AMA²)"
authors = [{ name = "Naman Joshi" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "langgraph>=0.0.10",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "psycopg2-binary>=2.9.6",
    "redis>=4.6.0",
    "celery>=5.3.0",
    "mlflow>=2.5.0",
    "faiss-cpu>=1.7.4",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "optuna>=3.2.0",
    "shap>=0.42.0",
    "structlog>=23.1.0",
    "pydantic-settings>=2.0.0",
    "reportlab>=4.0.0",
    "weasyprint>=59.0",
    "python-multipart>=0.0.6",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
